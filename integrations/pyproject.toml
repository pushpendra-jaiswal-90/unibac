[project]
name            = "unibac-integrations"
version         = "0.1.0"
description     = "Parsers (bank/CIBIL/GST), MCP server and LLM agent for Unibac LBI."
readme          = "README.md"
requires-python = ">=3.11"
authors         = [{ name = "Unibac Engineering" }]

dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    # MCP server runtime
    "mcp>=1.0.0",
    # Agent runtime
    "anthropic>=0.39",
    # Sandbox / synthetic data
    "duckdb>=1.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
lbi-mcp         = "unibac_integrations.mcp_server.server:main"
lbi-agent       = "unibac_integrations.agent.main:main"
lbi-sandbox-gen = "unibac_integrations.sandbox.generate:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unibac_integrations"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
