<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LBI Collections — Elm</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const appEl = document.getElementById("app");
  const app = Elm.Main.init({ node: appEl });

  // Minimal WebSocket shim driven by three Elm ports.
  let sock = null;
  app.ports.wsConnect.subscribe((url) => {
    if (sock) try { sock.close(); } catch (_) {}
    sock = new WebSocket(url);
    sock.onmessage = (ev) => app.ports.wsRecv.send(ev.data);
    sock.onopen    = () => app.ports.wsRecv.send(JSON.stringify({ type: "ready" }));
    sock.onclose   = () => app.ports.wsRecv.send(JSON.stringify({ type: "error", message: "disconnected" }));
    sock.onerror   = () => app.ports.wsRecv.send(JSON.stringify({ type: "error", message: "websocket error" }));
  });
  app.ports.wsSend.subscribe((data) => {
    if (sock && sock.readyState === 1) sock.send(data);
  });
</script>
</body>
</html>
