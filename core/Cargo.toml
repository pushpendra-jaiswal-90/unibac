[workspace]
resolver = "2"
members = [
    "crates/lbi-core",
    "crates/processing",
    "crates/okf-generator",
    "crates/cam-builder",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "Proprietary"
authors      = ["Unibac Engineering"]

[workspace.dependencies]
anyhow      = "1.0"
thiserror   = "1.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
csv         = "1.3"
chrono      = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "=1.35.0", features = ["serde", "maths"] }
clap        = { version = "4.5", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon       = "1.10"
tempfile    = "3.14"
