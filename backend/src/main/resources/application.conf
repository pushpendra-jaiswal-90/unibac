lbi {
  http {
    host = "0.0.0.0"
    port = 8080
  }
  db {
    url      = "jdbc:postgresql://localhost:5432/lbi"
    url      = ${?LBI_DB_URL}
    user     = "lbi"
    user     = ${?LBI_DB_USER}
    password = "lbi"
    password = ${?LBI_DB_PASSWORD}
  }
  core {
    # Path to the Rust `lbi-core` binary (CLI mode) or sidecar HTTP endpoint.
    binary = "../core/target/release/lbi-core"
    binary = ${?LBI_CORE_BINARY}
  }
  integrations {
    # Python MCP server endpoint.
    mcp_url = "http://localhost:8765"
    mcp_url = ${?LBI_MCP_URL}
  }
}
