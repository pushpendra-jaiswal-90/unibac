services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lbi
      POSTGRES_PASSWORD: lbi
      POSTGRES_DB: lbi
    ports:
      - "5432:5432"
    volumes:
      - lbi-pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lbi
      MINIO_ROOT_PASSWORD: lbi-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lbi-minio:/data

volumes:
  lbi-pg:
  lbi-minio:
